[project]
name = "whisper-writer"
version = "2.0.0"
description = "Speech-to-text desktop app using OpenAI's Whisper model — type by talking"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "VerbumEng", email = "verbumeng@gmail.com" },
]
keywords = ["whisper", "speech-to-text", "transcription", "voice-typing", "faster-whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/verbumeng/whisper-writer"
Repository = "https://github.com/verbumeng/whisper-writer"
Issues = "https://github.com/verbumeng/whisper-writer/issues"
Changelog = "https://github.com/verbumeng/whisper-writer/blob/main/CHANGELOG.md"
"Upstream Project" = "https://github.com/savbell/whisper-writer"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
